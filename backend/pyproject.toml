[project]
name = "tefteri"
version = "0.1.0"
description = "Tefteri: daily planning and execution framework (server)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "itsdangerous>=2.2",
  "uvicorn>=0.32",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "coverage>=7.6",
  "ruff>=0.8",
  "mypy>=1.13",
  "tach>=0.14",
  "pytest-alembic>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tefteri"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ASYNC", "S", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]
"migrations/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: needs a PostgreSQL database",
    "live: needs a real Vikunja, run it with `just backend::live-vikunja`",
]

[tool.coverage.run]
source = ["src/tefteri"]
branch = true
