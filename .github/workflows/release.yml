# Tag vX.Y.Z: build the server image and the client packages, publish them.
# Every build step calls `just` (see the root justfile); the other steps only provision tools.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
env:
  # The Flutter version of the Linux packages. Keep it equal to the one in devbox.json.
  FLUTTER_SDK: "3.47.4"
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: devbox run -- just release::image

  linux:
    # The oldest runner image that GitHub still offers: the packages then run on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The Linux packages are built without devbox. Devbox is for the development setup: its
      # Flutter links the GTK of the nix store, and a bundle like that does not start on other
      # computers. Use the compiler and the GTK of the system, and a plain Flutter SDK.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          file desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK }}
      - uses: extractions/setup-just@v2
      - run: just release::clients-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - run: devbox run -- just release::clients-android
        env:
          TEFTERI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TEFTERI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TEFTERI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TEFTERI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: devbox run -- just release::publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
