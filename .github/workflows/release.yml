# Tag vX.Y.Z: build the server image and the client packages, publish them.
# Every build step calls `just` (see the root justfile); the other steps only provision tools.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: devbox run -- just release::image

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # Linux desktop build and AppImage tools: not provided by devbox (README exceptions).
      # Do not install clang or GTK here. The devbox Flutter links its own GTK, and only the
      # devbox clang can link it (the system clang has an older glibc).
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build pkg-config file desktop-file-utils
      - uses: jetify-com/devbox-install-action@v0.12.0
      - run: devbox run -- just release::clients
        env:
          TEFTERI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TEFTERI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TEFTERI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TEFTERI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: devbox run -- just release::publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
