# Every push to the main branch is a release. The workflow takes the newest version tag, adds one
# to the patch number (1.2.3 -> 1.2.4, and 3.3 -> 3.3.1), builds the server image and the client
# packages with that version, and publishes them. The release creates the tag vX.Y.Z at the commit
# that was built. To start a new major or minor version, push a tag such as v1.3 by hand: the next
# release is then 1.3.1. A tag that is pushed by hand does not start a release itself.
# Every build step calls `just` (see the root justfile); the other steps only provision tools.
name: release
on:
  push:
    branches: [master]
    # A change of the documentation alone is not a release.
    paths-ignore: ["docs/**", "specs/**", "**/*.md"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
# One release at a time, in the order of the pushes, so that each one gets its own number.
concurrency:
  group: release
  cancel-in-progress: false
env:
  # The Flutter version of the Linux packages. Keep it equal to the one in devbox.json.
  FLUTTER_SDK: "3.47.4"
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.v.outputs.needed }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # All the tags are needed to find the newest version.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: extractions/setup-just@v2
      - id: v
        run: just release::next >> "$GITHUB_OUTPUT"

  image:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      TEFTERI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: devbox run -- just release::image

  linux:
    needs: version
    if: needs.version.outputs.needed == 'true'
    # The oldest runner image that GitHub still offers: the packages then run on older systems too.
    runs-on: ubuntu-22.04
    env:
      TEFTERI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The Linux packages are built without devbox. Devbox is for the development setup: its
      # Flutter links the GTK of the nix store, and a bundle like that does not start on other
      # computers. Use the compiler and the GTK of the system, and a plain Flutter SDK.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          file desktop-file-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_SDK }}
      - uses: extractions/setup-just@v2
      - run: just release::clients-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      TEFTERI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      # The Android build downloads Gradle, its Maven packages and the Dart packages on every run.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/*.gradle*',
            'frontend/android/gradle/wrapper/gradle-wrapper.properties', 'frontend/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      # The runner image has the Android SDK, but not the NDK and CMake that Flutter asks for: the
      # build downloads them (about 2 minutes). The NDK version is the one of Flutter 3.47.4
      # (devbox.json); when Flutter changes it, change the path and the key here.
      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-ndk-28.2.13676358-cmake-3.22.1
      - run: devbox run -- just release::clients-android
        env:
          TEFTERI_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          TEFTERI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TEFTERI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TEFTERI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  # The tag and the GitHub release are made last, when the image and the packages are built.
  publish:
    needs: [version, image, linux, android]
    if: needs.version.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      TEFTERI_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: devbox run -- just release::publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
