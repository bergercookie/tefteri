name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      # The Python packages (uv) are downloaded again on every run without this.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'docs/requirements.txt') }}
          restore-keys: uv-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('frontend/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      # The Dart hooks (format, analyze) need the package config; without it the formatter
      # uses another style and the analyzer cannot resolve imports.
      - run: devbox run -- just frontend::install
      - run: devbox run -- just lint
      - run: devbox run -- just test
      - run: devbox run -- just docs::build
      - run: devbox run -- just docs::check
  # Builds the image (web client included) and runs it with `docker run` and compose.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
        with: {enable-cache: true}
      - run: devbox run -- just deploy::smoke
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: tefteri, POSTGRES_DB: tefteri}
        ports: ["5432:5432"]
    env:
      TEFTERI_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:tefteri@localhost:5432/tefteri
    steps:
      - uses: actions/checkout@v4
      # This job needs only Python, uv and just, so it does not install the whole devbox
      # (Flutter, clang and the linters). The packages are the ones of backend/uv.lock, and the
      # Python version is the one of devbox.json.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: extractions/setup-just@v2
      - run: just backend::test-postgres
