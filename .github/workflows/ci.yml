name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
      # The Dart hooks (format, analyze) need the package config; without it the formatter
      # uses another style and the analyzer cannot resolve imports.
      - run: devbox run -- just frontend::install
      - run: devbox run -- just lint
      - run: devbox run -- just test
      - run: devbox run -- just docs::build
      - run: devbox run -- just docs::check
  # Builds the image (web client included) and runs it with `docker run` and compose.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
      - run: devbox run -- just deploy::smoke
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: tefteri, POSTGRES_DB: tefteri}
        ports: ["5432:5432"]
    env:
      TEFTERI_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:tefteri@localhost:5432/tefteri
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.12.0
      - run: devbox run -- just backend::test-postgres
