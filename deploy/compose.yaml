# Tefteri server. `just deploy::up` uses SQLite in the `data` volume.
# `just deploy::up-postgres` also starts PostgreSQL. Then set
# TEFTERI_DATABASE_URL=postgresql+asyncpg://tefteri:${POSTGRES_PASSWORD}@postgres:5432/tefteri
# in .env.
name: tefteri

services:
  tefteri:
    image: ${TEFTERI_IMAGE:-tefteri:local}
    env_file: .env
    ports:
      - "${TEFTERI_HOST_PORT:-8000}:8000"
    volumes:
      - data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_USER: tefteri
      POSTGRES_DB: tefteri
      # Not `:?`: compose resolves every service, so that would also fail `just deploy::up`.
      # The postgres image refuses to start without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tefteri"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  data:
  pgdata:
